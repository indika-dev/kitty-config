# -BEGIN_KITTY_FONTS-
#
font_family      family="Monaspace Neon Var" features='+calt +liga +ss01 +ss02 +ss03 +ss06 +ss07 +ss09 cv01=2'
bold_font        auto
italic_font      auto
bold_italic_font auto
# modify_font baseline -2
# -END_KITTY_FONTS-

font_size 16.0
text_composition_strategy platform

# os specifc
shell /run/current-system/sw/bin/bash --login

listen_on unix:/tmp/mykitty

# map ctrl+v send_key ctrl+v

# Tab Layout {{{

# include tab-bar-style-wezterm.conf
include macos-tabs.conf

# }}}
